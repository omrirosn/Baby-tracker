# XcodeGen spec — a fallback for regenerating RFIsSimple.xcodeproj.
#
# The committed .xcodeproj is the source of truth and opens directly in
# Xcode 16 or later. This file exists so the project can be rebuilt from
# scratch if it is ever damaged by a merge:
#
#     brew install xcodegen && xcodegen generate
#
# Keep the two in step when changing build settings.

name: RFIsSimple
options:
  bundleIdPrefix: com.rfissimple
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  RFIsSimple:
    type: application
    platform: iOS
    sources:
      - path: RFIsSimple
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rfissimple.RFIsSimple
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown

  RFIsSimpleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RFIsSimpleTests
    dependencies:
      - target: RFIsSimple
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rfissimple.RFIsSimpleTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RFIsSimple:
    build:
      targets:
        RFIsSimple: all
    test:
      targets:
        - RFIsSimpleTests
    run:
      config: Debug
